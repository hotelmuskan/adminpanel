  <style>
    :root {
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --gold: #d4af37;
      --black: #0a0a0a;
      --white: #ffffff;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      background: var(--black) !important;
      color: var(--white) !important;
    }
    #app {
      background: var(--black) !important;
      color: var(--white) !important;
    }
    .font-display { font-family: 'Playfair Display', serif; }
    
    .bottom-nav {
      padding-bottom: calc(12px + var(--safe-bottom));
      background: #000 !important;
      border-top: 1px solid rgba(212,175,55,0.4) !important;
    }
    .floating-cart {
      bottom: calc(80px + var(--safe-bottom));
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .status-timeline::before {
      content: '';
      position: absolute;
      left: 15px;
      top: 24px;
      bottom: 24px;
      width: 2px;
      background: #e5e7eb;
    }

    /* 3D Thali Scene */
    .thali-scene {
      perspective: 900px;
      perspective-origin: 50% 40%;
    }
    .thali-plate-3d {
      width: 280px;
      height: 280px;
      margin: 0 auto;
      position: relative;
      border-radius: 50%;
      transform-style: preserve-3d;
      transform: rotateX(28deg) rotateZ(0deg);
      background: radial-gradient(circle at 50% 42%, #f5e6c8 0%, #e8d4a8 25%, #d4b87a 45%, #c4a060 60%, #a88848 75%, #8a6e38 88%, #6b5428 100%);
      box-shadow: 0 25px 50px rgba(0,0,0,0.45), 0 10px 20px rgba(0,0,0,0.3), inset 0 -8px 20px rgba(0,0,0,0.15), inset 0 8px 16px rgba(255,255,255,0.35), 0 0 0 4px #c9a227, 0 0 0 7px #8a6e38, 0 0 0 10px #d4af37;
      animation: thaliFloat 4s ease-in-out infinite;
    }
    @keyframes thaliFloat {
      0%, 100% { transform: rotateX(28deg) translateY(0); }
      50% { transform: rotateX(28deg) translateY(-6px); }
    }
    .compartment-3d {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #fff9f0, #f0e4c8);
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.12), 0 3px 8px rgba(0,0,0,0.2), 0 0 0 1.5px rgba(168, 136, 72, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform: translateZ(12px);
      overflow: hidden;
    }
    .compartment-3d.filled {
      transform: translateZ(18px) scale(1.08);
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.1), 0 6px 14px rgba(0,0,0,0.25), 0 0 0 2px #d4af37;
    }
    .thali-center-3d {
      position: absolute;
      left: 50%; top: 50%;
      width: 68px; height: 68px;
      margin: -34px 0 0 -34px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #fff9f0, #e8d9b0);
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.12), 0 4px 12px rgba(0,0,0,0.25), 0 0 0 2px rgba(168, 136, 72, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      transform: translateZ(20px);
      z-index: 5;
      overflow: hidden;
    }
    .thali-center-3d.filled {
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.1), 0 6px 16px rgba(0,0,0,0.3), 0 0 0 2.5px #d4af37;
    }

    input, textarea, select {
      background: #1a1a1a !important;
      color: #ffffff !important;
      border: 1px solid rgba(212,175,55,0.4) !important;
    }
    input::placeholder, textarea::placeholder {
      color: rgba(255,255,255,0.35) !important;
    }

    html, body, #app, #main-content, #main-content *, 
    main, main *, p, span, div, a, li, label, td, th, button {
      color: #ffffff !important;
    }

    h1, h2, h3, h4, .font-display, [class*="font-display"], .text-gold {
      color: #d4af37 !important;
    }
    .font-bold {
      color: #f0d78c !important;
    }

    button.bg-yellow-500, button.bg-gold-500, [class*="bg-gold-500"],
    button[class*="bg-[#d4af37]"], #floating-cart, #floating-cart * {
      background: var(--gold) !important;
      color: #000000 !important;
      font-weight: 700 !important;
    }

    .receipt-paper {
      background: #fffef8 !important;
      color: #000 !important;
      font-family: 'Courier New', Courier, monospace;
    }
    .receipt-paper * {
      color: #000 !important;
    }

    .loader-ring {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 3px solid rgba(212, 175, 55, 0.2);
      border-radius: 50%;
      border-top-color: #d4af37;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBhZl84pL0CER7OtmR-8RIgrXJMILB59JM",
      authDomain: "hoteloowner.firebaseapp.com",
      projectId: "hoteloowner",
      storageBucket: "hoteloowner.firebasestorage.app",
      messagingSenderId: "299586039524",
      appId: "1:299586039524:web:c67bd4b2cee14d041706f1"
    };

    const fbApp = initializeApp(firebaseConfig);
    const db = getFirestore(fbApp);

    window.pushOrderToFirestore = async function(order) {
      try {
        await addDoc(collection(db, "orders"), {
          tableNumber: order.table,
          customerName: order.customerName || "",
          phone: order.customerPhone || "",
          items: (order.items || []).map(function(i) {
            return { name: i.name, qty: i.qty, price: i.price };
          }),
          total: order.total,
          status: "new",
          createdAt: serverTimestamp()
        });
        console.log("Order saved to Firestore successfully!");
      } catch (e) {
        console.error("Firestore order push failed:", e);
      }
    };
  </script>

      var q = "pa=" + encodeURIComponent(pa) + "&pn=" + pn + "&cu=INR&tn=" + tn;
      if (am) q += "&am=" + am;
      return {

        amount: am,
        upi: "upi://pay?" + q,
        gpay: "tez://upi/pay?" + q,
        phonepe: "phonepe://pay?" + q,

      };

    function tryOpenSpecificUpi(method, amount) {
      var links = buildUpiUrl(amount);

      var targetUrl = links.upi;
      if (method === "gpay") targetUrl = links.gpay;
      else if (method === "phonepe") targetUrl = links.phonepe;
      else if (method === "paytm") targetUrl = links.paytm;
      else if (method === "navi") targetUrl = links.navi;

      var a = document.createElement("a");
      a.href = targetUrl;
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      setTimeout(function() { try { document.body.removeChild(a); } catch(e) {} }, 500);
      return links;
    }

    async function sendBillWithImageToWhatsApp(order) {
      if (!order) return;
      showToast("Preparing Bill Image & Text...");

      const renderContainer = document.getElementById("hidden-receipt-render");
      renderContainer.innerHTML = createReceiptHtml(order);

      try {
        const canvas = await html2canvas(renderContainer.firstElementChild, { scale: 2, backgroundColor: "#fffef8" });
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        const file = new File([blob], `Hotel_Muskan_Bill_${order.id}.png`, { type: 'image/png' });
        const shareText = buildBillText(order);

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: `Hotel Muskan Bill ${order.id}`,
            text: shareText
          });
          showToast("Bill shared with Image!");
        } else {
          var link = document.createElement("a");
          link.download = file.name;
          link.href = canvas.toDataURL("image/png");
          link.click();

          var cleanPhone = (order.customerPhone || state.customerPhone || "").replace(/[^0-9]/g, "");
          if (cleanPhone.length === 10) cleanPhone = "91" + cleanPhone;
          var waUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(shareText);
          if (cleanPhone.length >= 10) {
            waUrl = "https://api.whatsapp.com/send?phone=" + cleanPhone + "&text=" + encodeURIComponent(shareText);
          }
          window.open(waUrl, "_blank");
          showToast("Bill image saved! Select it in WhatsApp chat.");
        }
      } catch (err) {
        console.error(err);
        showToast("Opening WhatsApp...");
        var cleanPhone = (order.customerPhone || state.customerPhone || "").replace(/[^0-9]/g, "");
        if (cleanPhone.length === 10) cleanPhone = "91" + cleanPhone;
        var waUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(buildBillText(order));
        if (cleanPhone.length >= 10) waUrl = "https://api.whatsapp.com/send?phone=" + cleanPhone + "&text=" + encodeURIComponent(buildBillText(order));
        window.open(waUrl, "_blank");
      }
    }

    function foodCard(item) {
      const isUnavailable = item.available === false;
      return `
        <div class="bg-neutral-900 rounded-2xl border border-gold-500/20 overflow-hidden shadow-sm flex flex-col justify-between ${isUnavailable ? 'opacity-50 grayscale' : ''}">
          <div>
            <div class="h-28 bg-neutral-900 relative overflow-hidden">
              <img src="${item.img}" alt="${item.name}" class="w-full h-full object-cover" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
              <div class="hidden absolute inset-0 items-center justify-center text-4xl bg-neutral-800">🍽️</div>
              ${item.badge ? `<span class="absolute top-2 left-2 text-[9px] bg-black/80 text-yellow-400 border border-gold-500/40 px-1.5 py-0.5 rounded-full font-medium">${item.badge}</span>` : ""}
              <span class="absolute top-2 right-2 text-sm drop-shadow">${item.veg ? "🟢" : "🔴"}</span>
              ${isUnavailable ? `<span class="absolute inset-0 bg-black/70 flex items-center justify-center text-xs font-bold text-red-400 uppercase">Sold Out</span>` : ''}
            </div>
            <div class="p-3">
              <h3 class="font-semibold text-sm leading-tight line-clamp-1 text-white">${item.name}</h3>
              <div class="flex items-center gap-1 mt-1 text-[10px]" style="color:rgba(255,255,255,0.6)">
                <span>★ ${item.rating || 4.5}</span>
                <span>•</span>
                <span>${item.orders || 100}+ orders</span>
              </div>
            </div>
          </div>
          <div class="p-3 pt-0">
            <div class="flex items-center justify-between mb-2">
              <span class="font-bold text-yellow-400">${formatPrice(item.price)}</span>
              ${item.halfPrice && !isUnavailable ? `<button onclick="App.addHalf('${item.id}')" class="text-[10px] px-2 py-0.5 border border-yellow-500/40 rounded-full" style="color:#d4af37">Half ₹${item.halfPrice}</button>` : ''}
            </div>
            <div class="flex gap-1.5">
              <button onclick="${isUnavailable ? '' : `App.addToCart('${item.id}')`}" class="flex-1 ${isUnavailable ? 'bg-neutral-800 text-stone-500 cursor-not-allowed' : 'bg-gold-500 text-black'} text-xs font-semibold py-1.5 rounded-full active:scale-95 transition">
                ${isUnavailable ? 'UNAVAILABLE' : 'ADD'}
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderThali() {
      const { total, cal } = thaliTotal();
      const compartments = [
        { key: "rice", label: "Rice" },
        { key: "bread", label: "Bread" },
        { key: "dal", label: "Dal" },
        { key: "sabzi", label: "Sabzi" },
        { key: "protein", label: "Protein" },
        { key: "dessert", label: "Dessert" }
      ];

      return `
        <div class="px-4 pt-14 pb-4">
          <div class="flex items-center justify-between mb-1">
            <h1 class="font-display text-2xl font-bold">Build Your Thali</h1>
            <button onclick="App.randomThali()" class="text-[10px] px-2 py-1 rounded-full border border-yellow-500/50" style="color:#d4af37">🎲 Surprise</button>
          </div>
          <p class="text-sm mb-5" style="color:rgba(255,255,255,0.6)">Tap items to place them on the plate</p>

          <div class="thali-scene mb-8 mt-2">
            <div class="thali-plate-3d">
              <div class="thali-center-3d ${state.thali.protein ? 'filled' : ''}">
                ${state.thali.protein
                  ? (state.thali.protein.img ? `<img src="${state.thali.protein.img}" class="food-item-enter w-full h-full object-cover" alt=""/>` : `<span style="font-size:24px">${state.thali.protein.emoji || '🧀'}</span>`)
                  : `<span style="font-size:11px;color:#8a6e38;text-align:center;line-height:1.2">Main</span>`}
              </div>
              ${compartments.filter(c => c.key !== "protein").map((c, i) => {
                const angle = (i * 60) - 90;
                const rad = (angle * Math.PI) / 180;
                const r = 92;
                const x = Math.cos(rad) * r;
                const y = Math.sin(rad) * r;
                const item = state.thali[c.key];
                return `
                  <div class="compartment-3d ${item ? 'filled' : ''}"
                       style="left:50%;top:50%;margin-left:-28px;margin-top:-28px;transform:translate(${x}px, ${y}px) translateZ(12px);">
                    ${item
                      ? (item.img ? `<img src="${item.img}" class="food-item-enter w-full h-full object-cover" alt=""/>` : `<span style="font-size:18px">${item.emoji || '🍲'}</span>`)
                      : `<span style="font-size:9px;color:#a88848;text-align:center;padding:2px">${c.label}</span>`}
                  </div>`;
              }).join("")}
              ${state.thali.sides.length ? `
              <div style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%) translateZ(15px);display:flex;gap:4px;z-index:6">
                ${state.thali.sides.map(s => s.img 
                  ? `<img src="${s.img}" class="w-6 h-6 rounded-full object-cover shadow border border-gold-500" alt=""/>` 
                  : `<span style="font-size:14px">${s.emoji}</span>`).join("")}
              </div>` : ""}
            </div>
            <p style="text-align:center;font-size:10px;color:#c9a227;margin-top:12px">↻ 3D Thali — tap items below to fill</p>
          </div>

          <div class="bg-neutral-900 border border-gold-500/30 rounded-2xl p-4 mb-5 flex justify-between items-center text-white">
            <div>
              <div class="text-xs" style="color:rgba(255,255,255,0.6)">Your Thali</div>
              <div class="font-bold text-lg text-yellow-400">${formatPrice(total)}</div>
              <div class="text-xs" style="color:rgba(255,255,255,0.6)">${cal} kcal</div>
            </div>
            <button onclick="App.addThaliToCart()" class="bg-gold-500 text-black font-semibold px-5 py-2.5 rounded-full text-sm ${total === 0 ? "opacity-40 pointer-events-none" : ""}">
              Add to Cart
            </button>
          </div>

          <h3 class="font-semibold text-sm mb-2">Quick Presets</h3>
          <div class="flex gap-2 overflow-x-auto hide-scrollbar mb-5 pb-1">
            ${THALI_PRESETS.map(p => `
              <button onclick="App.applyPreset('${p.id}')" class="flex-shrink-0 bg-neutral-900 border border-gold-500/20 rounded-xl px-3 py-2 text-left active:scale-95 transition">
                <div class="text-lg">${p.emoji}</div>
                <div class="text-xs font-semibold">${p.name}</div>
                <div class="text-[10px] text-yellow-500 font-medium">${formatPrice(p.price)}</div>
              </button>
            `).join("")}
          </div>

          ${Object.entries(THALI_OPTIONS).map(([key, options]) => {
            const labels = {
              rice: "Rice / Pulao",
              bread: "Roti / Naan",
              dal: "Dal",
              sabzi: "Sabzi",
              protein: "Main Protein",
              sides: "Sides",
              dessert: "Dessert"
            };
            const isMulti = key === "sides";
            return `
              <div class="mb-4">
                <h4 class="text-sm font-semibold mb-2">${labels[key]}</h4>
                <div class="grid grid-cols-2 gap-2">
                  ${options.map(opt => {
                    const selected = isMulti
                      ? state.thali.sides.some(s => s.id === opt.id)
                      : state.thali[key]?.id === opt.id;
                    const isOut = opt.available === false;
                    return `
                      <button onclick="${isOut ? '' : `App.selectThaliItem('${key}', '${opt.id}')`}"
                        class="p-2 rounded-xl text-xs font-medium border flex items-center gap-2 transition active:scale-95 text-left
                          ${isOut ? 'opacity-40 bg-neutral-900 border-neutral-800' : selected ? "bg-gold-500 text-black border-gold-500" : "bg-neutral-900 border-gold-500/20 text-white"}">
                        ${opt.img ? `<img src="${opt.img}" class="w-8 h-8 rounded-lg object-cover flex-shrink-0" alt=""/>` : `<span class="text-lg">${opt.emoji}</span>`}
                        <div class="min-w-0 flex-1">
                          <div class="truncate font-semibold">${opt.name} ${isOut ? '(Out)' : ''}</div>
                          <div class="text-[10px] opacity-80">${formatPrice(opt.price)}</div>
                        </div>
                      </button>
                    `;
                  }).join("")}
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderMenu() {
      const cats = [
        { id: "paneer", name: "Paneer Specials" },
        { id: "nonveg", name: "Non-Veg Delights" },
        { id: "rice", name: "Rice" },
        { id: "bread", name: "Breads" },
        { id: "beverages", name: "Extras" }
      ];

      const filteredItems = MENU.filter(m => {
        const matchesQuery = !state.searchQuery || 
          m.name.toLowerCase().includes(state.searchQuery.toLowerCase());
        const matchesType = state.activeFilter === 'all' || 
          (state.activeFilter === 'veg' && m.veg) || 
          (state.activeFilter === 'nonveg' && !m.veg);
        return matchesQuery && matchesType;
      });

      return `
        <div class="pt-14 pb-4">
          <div class="px-4 mb-3">
            <h1 class="font-display text-2xl font-bold" style="color:#d4af37">Menu</h1>
            <p class="text-sm mt-0.5" style="color:rgba(255,255,255,0.6)">Hotel Muskan · ${state.table}</p>
          </div>

          <div class="px-4 mb-4 space-y-2">
            <input type="text" value="${state.searchQuery}" placeholder="🔍 Search dishes..."
                   oninput="App.handleSearch(this.value)"
                   class="w-full px-3.5 py-2 text-xs rounded-xl border border-yellow-500/30 focus:outline-none" />
            <div class="flex gap-2 text-xs">
              <button onclick="App.setFilter('all')" class="px-3 py-1 rounded-full border ${state.activeFilter === 'all' ? 'bg-gold-500 text-black border-gold-500' : 'border-yellow-500/40 text-white'}">All</button>
              <button onclick="App.setFilter('veg')" class="px-3 py-1 rounded-full border ${state.activeFilter === 'veg' ? 'bg-green-600 text-white border-green-600' : 'border-yellow-500/40 text-white'}">🟢 Pure Veg</button>
              <button onclick="App.setFilter('nonveg')" class="px-3 py-1 rounded-full border ${state.activeFilter === 'nonveg' ? 'bg-red-600 text-white border-red-600' : 'border-yellow-500/40 text-white'}">🔴 Non-Veg</button>
            </div>
          </div>

          <div class="px-4 space-y-8">
            ${cats.map(c => {
              const items = filteredItems.filter(m => m.cat === c.id);
              if (!items.length) return "";
              return `
                <div id="cat-${c.id}">
                  <h2 class="font-semibold text-base mb-3" style="color:#d4af37">${c.name}</h2>
                  <div class="grid grid-cols-2 gap-3">
                    ${items.map(item => foodCard(item)).join("")}
                  </div>
                </div>`;
            }).join("")}
          </div>
        </div>
      `;
    }

      var statusNames = ["Placed", "Accepted", "Preparing", "Ready", "Serving", "Served"];

      return `
        <div class="pt-14 px-4 pb-10">

              <p class="text-xs text-stone-400">${state.customerPhone ? `Account: ${state.customerPhone}` : 'Guest Mode'}</p>
            </div>
            ${!state.customerPhone ? `
              <button onclick="App.openLoginModal()" class="text-xs px-3 py-1.5 rounded-full bg-gold-500 text-black font-bold">Login</button>
            ` : `
              <button onclick="App.logout()" class="text-[10px] px-2.5 py-1 rounded-full border border-red-500/40 text-red-400">Logout</button>

          </div>

          ${!state.customerPhone ? `
            <div class="text-center py-16 bg-neutral-900 border border-gold-500/20 rounded-2xl p-6">

                Browse Menu
              </button>
            </div>
          ` : userOrders.map(function(o) {

                <div class="space-y-1.5 my-3 border-y border-neutral-800 py-2.5">
                  ${(o.items || []).map(function(i) {
                    return `
                      <div class="flex justify-between text-xs" style="color:rgba(255,255,255,0.85)">
                        <span>${i.qty || 1}× ${i.name}</span>
                        <span>₹${(i.price || 0) * (i.qty || 1)}</span>
                      </div>
                    `;
                  }).join("")}

                <div class="flex gap-2 mt-2">
                  <button onclick="App.reorderItems('${o.id}')" class="flex-1 py-2 bg-gold-500 text-black rounded-xl text-xs font-bold">
                    🔄 Re-Order Items
                  </button>
                  <button onclick="App.printPaperReceipt('${o.id}')" class="flex-1 py-2 bg-neutral-900 border border-yellow-500/40 rounded-xl text-xs font-semibold text-yellow-400">
                    🧾 View Bill
                  </button>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

      if (state.cart.length === 0) {
        return `
          <div class="pt-20 px-6 text-center">
            <div class="text-6xl mb-4">🛒</div>

                </div>
                <div class="flex-1 min-w-0">

            <label class="block text-[11px] font-semibold text-yellow-400 mb-1">👨‍🍳 Cooking / Kitchen Instructions</label>
            <input type="text" id="cart-cooking-notes" value="${state.cookingNotes || ''}" oninput="state.cookingNotes = this.value" placeholder="e.g. Less spicy, Extra gravy, No onions..." class="w-full text-xs px-3 py-2 rounded-xl focus:outline-none" />

                  <button onclick="App.setTip(${tip})" class="px-2 py-0.5 rounded-lg border text-[10px] ${state.tipAmount === tip ? 'bg-gold-500 text-black border-gold-500 font-bold' : 'border-yellow-500/30 text-stone-300'}">

                  </button>

            </div>

          <div class="bg-neutral-900 border border-gold-500/30 rounded-2xl p-3.5 mb-4">
            <div class="flex justify-between items-center mb-2">
              <label class="text-[11px] font-semibold text-yellow-400">👤 Guest Identification</label>
              <button onclick="App.openLoginModal()" class="text-[10px] text-stone-400 underline">Change</button>
            </div>
            ${state.customerPhone ? `
              <div class="text-xs font-semibold text-white">${state.customerName || 'Guest'} (${state.customerPhone})</div>
            ` : `
              <button onclick="App.openLoginModal()" class="w-full bg-neutral-800 border border-dashed border-gold-500/40 text-yellow-400 py-2 rounded-xl text-xs font-semibold">

      const total = cartTotal();
      const methods = [
        { id: "phonepe", name: "PhonePe", icon: "💜", desc: UPI_VPA },
        { id: "gpay", name: "Google Pay", icon: "🔵", desc: UPI_VPA },

                <div class="text-xl">💜</div>

        return (o.id && o.id.toLowerCase().includes(q)) || 
               (o.table && o.table.toLowerCase().includes(q)) || 
               (o.customerPhone && o.customerPhone.includes(q)) ||
               (o.customerName && o.customerName.toLowerCase().includes(q));

                <div>
                  <div class="font-bold text-sm text-yellow-400">${r.type === 'waiter' ? '🙋 Waiter Requested' : '💧 Water Requested'}</div>
                  <div class="text-xs text-stone-300 mt-0.5">Table: <b class="text-white">${r.table}</b> · ${r.time}</div>

                <div>
                  <h3 class="text-xs font-bold text-yellow-400 uppercase tracking-wider mb-2">${thaliCategoryNames[catKey] || catKey}</h3>
                  <div class="space-y-2">
                    ${items.map(item => `
                      <div class="bg-neutral-900 border border-gold-500/30 rounded-2xl p-3 flex items-center justify-between gap-3">
                        ${item.img ? `<img src="${item.img}" class="w-12 h-12 rounded-xl object-cover bg-neutral-800 flex-shrink-0" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" /><div class="hidden w-12 h-12 rounded-xl bg-neutral-800 items-center justify-center text-xl flex-shrink-0">${item.emoji || '🍱'}</div>` : `<div class="w-12 h-12 rounded-xl bg-neutral-800 flex items-center justify-center text-xl flex-shrink-0">${item.emoji || '🍱'}</div>`}
                        <div class="flex-1 min-w-0">
                          <div class="font-bold text-xs truncate">${item.name}</div>
                          <div class="text-[10px] text-stone-400">${item.cal || 0} kcal · ${item.veg === false ? '🔴 Non-Veg' : '🟢 Veg'}</div>
                          <div class="text-xs font-bold text-yellow-400">₹${item.price}</div>
                        </div>
                        <div class="flex flex-col gap-1">
                          <button onclick="App.toggleThaliStock('${catKey}', '${item.id}')" class="px-2 py-0.5 rounded-lg text-[9px] font-bold border ${item.available !== false ? 'bg-green-900/40 border-green-500 text-green-300' : 'bg-red-900/40 border-red-500 text-red-300'}">

                            <button onclick="App.openEditThaliItemModal('${catKey}', '${item.id}')" class="px-2 py-1 bg-neutral-800 border border-yellow-500/40 text-yellow-400 rounded-lg text-[10px] font-bold">Edit</button>
                            <button onclick="App.deleteThaliItem('${catKey}', '${item.id}')" class="px-2 py-1 bg-neutral-800 border border-red-500/40 text-red-400 rounded-lg text-[10px] font-bold">Del</button>

              </button>
              <button onclick="App.resetMenuToDefault()" class="px-3 py-2 border border-red-500/40 text-red-400 rounded-xl text-xs font-semibold">
                Reset Menu
              </button>

            <div class="space-y-3">
              ${MENU.map((item, idx) => `
                <div class="bg-neutral-900 border border-gold-500/30 rounded-2xl p-3 flex items-center justify-between gap-3">
                  <img src="${item.img}" class="w-12 h-12 rounded-xl object-cover bg-neutral-800 flex-shrink-0" onerror="this.src='https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=200&h=200&fit=crop'" />
                  <div class="flex-1 min-w-0">
                    <div class="font-bold text-xs truncate">${item.name}</div>
                    <div class="text-[10px] text-stone-400">${item.veg ? '🟢 Veg' : '🔴 Non-Veg'} · Cat: ${item.cat}</div>

                  <div class="flex flex-col gap-1">
                    <button onclick="App.toggleDishStock('${item.id}')" class="px-2 py-0.5 rounded-lg text-[9px] font-bold border ${item.available !== false ? 'bg-green-900/40 border-green-500 text-green-300' : 'bg-red-900/40 border-red-500 text-red-300'}">

      `;
    }

    // ========== EXPOSED API ==========
    window.App = {
      async initAppFlow() {
        if ("Notification" in window && Notification.permission !== "granted") {
          Notification.requestPermission();
        }
        setTimeout(function () {
          const loadingScreen = document.getElementById("loading-screen");
          loadingScreen.style.opacity = "0";
          setTimeout(function () {
            loadingScreen.style.display = "none";
            if (!state.customerPhone) {
              const loginScreen = document.getElementById("login-screen");
              loginScreen.classList.remove("hidden");
              loginScreen.classList.add("flex");
            } else {
              App.showMainApp();
            }
          }, 600);
        }, 1800);
      },

      showMainApp() {
        const app = document.getElementById("app");
        app.classList.remove("hidden");
        updateProfileUI();
        App.navigate("home");
      },

      submitInitialLogin() {
        const nameInput = document.getElementById("initial-login-name");
        const phoneInput = document.getElementById("initial-login-phone");
        const phone = (phoneInput.value || "").trim().replace(/[^0-9]/g, "");
        const name = (nameInput.value || "").trim();

        if (phone.length < 10) {
          showToast("Please enter a valid 10-digit number");
          return;
        }

        state.customerPhone = phone;
        state.customerName = name || "Customer";
        localStorage.setItem("muskan_user_phone", state.customerPhone);
        localStorage.setItem("muskan_user_name", state.customerName);

        const loginScreen = document.getElementById("login-screen");
        loginScreen.classList.add("hidden");
        loginScreen.classList.remove("flex");

        App.showMainApp();
        showToast("Welcome, " + state.customerName);
      },

      skipLogin() {
        const loginScreen = document.getElementById("login-screen");
        loginScreen.classList.add("hidden");
        loginScreen.classList.remove("flex");
        App.showMainApp();
      },

      navigate(screen) {
        state.screen = screen;
        setActiveNav(screen);
        const main = document.getElementById("main-content");
        let html = "";
        switch (screen) {
          case "home": html = renderHome(); break;
          case "thali": html = renderThali(); break;
          case "menu": html = renderMenu(); break;
          case "myorders": html = renderMyOrders(); break;
          case "admin": html = renderAdmin(); break;
          case "cart": html = renderCart(); break;
          case "payment": html = renderPayment(); break;
          case "order": html = renderOrderTracking(); break;
          default: html = renderHome();
        }
        main.innerHTML = html;
        window.scrollTo(0, 0);
        updateCartUI();
        updateProfileUI();
      },

      setAdminTab(tab) {
        state.adminTab = tab;
        App.navigate('admin');
      },

      handleAdminSearch(val) {
        state.adminOrderSearch = val;
        const main = document.getElementById("main-content");
        if (state.screen === 'admin') main.innerHTML = renderAdmin();
      },

      setTip(amount) {
        state.tipAmount = amount;
        App.navigate("cart");
      },

      reorderItems(orderId) {
        const orders = loadOrders();
        const o = orders.find(x => x.id === orderId);
        if (!o || !o.items) return;
        state.cart = [...o.items];
        updateCartUI();
        showToast("Previous order added to cart!");
        App.navigate("cart");
      },

      toggleDishStock(id) {
        const updated = MENU.map(m => m.id === id ? { ...m, available: m.available === false ? true : false } : m);
        saveMenuData(updated);
        showToast("Item stock updated!");
        App.navigate("admin");
      },

      toggleThaliStock(catKey, id) {
        const updated = { ...THALI_OPTIONS };
        if (updated[catKey]) {
          updated[catKey] = updated[catKey].map(i => i.id === id ? { ...i, available: i.available === false ? true : false } : i);
        }
        saveThaliData(updated);
        showToast("Thali stock updated!");
        App.navigate("admin");
      },

      exportOrdersToCSV() {
        const orders = loadOrders();
        if (orders.length === 0) {
          showToast("No orders to export");
          return;
        }
        let csvContent = "data:text/csv;charset=utf-8,Bill ID,Table,Customer Name,Phone,Time,Payment,Total\n";
        orders.forEach(o => {
          csvContent += `"${o.id}","${o.table}","${o.customerName || 'Guest'}","${o.customerPhone || ''}","${o.time}","${o.payment}","${o.total}"\n`;
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Hotel_Muskan_Sales_${Date.now()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast("Sales Report Downloaded!");
      },

      handleFileUpload(inputElement, targetInputId, previewContainerId) {
        const file = inputElement.files[0];
        if (!file) return;

        if (file.size > 2 * 1024 * 1024) {
          showToast("Image size should be less than 2MB");
          return;
        }

      saveEditThaliItem(oldCatKey, itemId) {
        const name = document.getElementById("edit-thali-name").value.trim();
        const price = Number(document.getElementById("edit-thali-price").value) || 0;
        const cal = Number(document.getElementById("edit-thali-cal").value) || 0;
        const newCatKey = document.getElementById("edit-thali-cat").value;
        const veg = document.getElementById("edit-thali-veg").value === "true";
        const emoji = document.getElementById("edit-thali-emoji").value.trim() || "🍛";
        const img = document.getElementById("edit-thali-img").value.trim();

        const updatedOptions = { ...THALI_OPTIONS };
        let itemToUpdate = null;

        if (updatedOptions[oldCatKey]) {
          const idx = updatedOptions[oldCatKey].findIndex(i => i.id === itemId);
          if (idx !== -1) {
            itemToUpdate = { ...updatedOptions[oldCatKey][idx], name, price, cal, emoji, img, veg };
            updatedOptions[oldCatKey].splice(idx, 1);
          }
        }

        if (itemToUpdate) {
          if (!updatedOptions[newCatKey]) updatedOptions[newCatKey] = [];
          updatedOptions[newCatKey].push(itemToUpdate);
        }

        saveThaliData(updatedOptions);
        App.closeModal();
        showToast("Thali item updated!");
        App.navigate("admin");
      },

      saveLogin(onSuccessNav) {
        const phoneInput = document.getElementById("login-phone-input");
        const nameInput = document.getElementById("login-name-input");
        const phone = (phoneInput.value || "").trim().replace(/[^0-9]/g, "");
        const name = (nameInput.value || "").trim();

        if (phone.length < 10) {
          showToast("Please enter a valid 10-digit number");
          return;
        }

        state.customerPhone = phone;
        state.customerName = name || "Guest";
        localStorage.setItem("muskan_user_phone", state.customerPhone);
        localStorage.setItem("muskan_user_name", state.customerName);

        App.closeModal();
        updateProfileUI();
        showToast("Logged in as " + state.customerPhone);

        if (onSuccessNav) App.navigate(onSuccessNav);
        else App.navigate(state.screen);
      },

        localStorage.removeItem("muskan_user_phone");
        localStorage.removeItem("muskan_user_name");
        state.customerPhone = '';
        state.customerName = '';
        updateProfileUI();
        showToast("Logged out");
        App.navigate("home");
      },

        const modal = document.getElementById("modal-container");

      setFilter(type) {
        state.activeFilter = type;
        const main = document.getElementById("main-content");
        if (state.screen === 'menu') main.innerHTML = renderMenu();
      },

      addToCart(id) {
        const item = MENU.find(m => m.id === id);
        if (!item || item.available === false) return;
        const existing = state.cart.find(c => c.id === id && !c.custom);
        if (existing) existing.qty++;
        else state.cart.push({ ...item, qty: 1, name: item.name });
        updateCartUI();
        showToast("Added to cart ✓");
      },

      addHalf(id) {
        const item = MENU.find(m => m.id === id);
        if (!item || !item.halfPrice || item.available === false) return;
        const halfName = item.name + " (Half)";
        const existing = state.cart.find(c => c.id === id + "-half");
        if (existing) existing.qty++;
        else state.cart.push({ id: id + "-half", name: halfName, price: item.halfPrice, qty: 1, img: item.img, veg: item.veg });
        updateCartUI();
        showToast("Half plate added ✓");
      },

      updateQty(idx, delta) {
        state.cart[idx].qty += delta;
        if (state.cart[idx].qty <= 0) state.cart.splice(idx, 1);
        App.navigate("cart");
      },

      selectThaliItem(category, id) {
        const options = THALI_OPTIONS[category];
        const item = options.find(o => o.id === id);
        if (!item || item.available === false) return;
        if (category === "sides") {
          const idx = state.thali.sides.findIndex(s => s.id === id);
          if (idx >= 0) state.thali.sides.splice(idx, 1);
          else state.thali.sides.push(item);
        } else {
          state.thali[category] = state.thali[category]?.id === id ? null : item;
        }
        App.navigate("thali");
      },

      applyPreset(presetId) {
        const preset = THALI_PRESETS.find(p => p.id === presetId);
        if (!preset) return;
        state.thali = { rice: null, bread: null, dal: null, sabzi: null, protein: null, sides: [], dessert: null };
        preset.items.forEach(id => {
          for (const [cat, opts] of Object.entries(THALI_OPTIONS)) {
            const found = opts.find(o => o.id === id);
            if (found && found.available !== false) {
              if (cat === "sides") state.thali.sides.push(found);
              else state.thali[cat] = found;
              break;
            }
          }
        });
        App.navigate("thali");
        showToast("Preset applied");
      },

      addThaliToCart() {
        const { total } = thaliTotal();
        if (total === 0) return;
        const parts = [];
        ["rice", "bread", "dal", "sabzi", "protein", "dessert"].forEach(k => {
          if (state.thali[k]) parts.push(state.thali[k].name);
        });
        state.thali.sides.forEach(s => parts.push(s.name));
        state.cart.push({
          id: "custom-thali-" + Date.now(),
          name: "Custom Thali",
          price: total,
          qty: 1,
          img: state.thali.protein?.img || "https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=400&fit=crop",
          custom: parts.join(", "),
          veg: !state.thali.protein || state.thali.protein.veg !== false
        });
        state.thali = { rice: null, bread: null, dal: null, sabzi: null, protein: null, sides: [], dessert: null };
        updateCartUI();
        showToast("Thali added to cart!");
        App.navigate("cart");
      },

      selectPayment(method) {
        state.paymentMethod = method;
        App.navigate("payment");
      },

      directAppPay(method) {
        if (!state.customerPhone) {
          App.openLoginModal('payment');
          return;
        }
        var total = cartTotal();
        state.paymentMethod = method;
        tryOpenSpecificUpi(method, total);
        setTimeout(function() {
          App.executeOrderPlacement(method, total);
        }, 3000);
      },

      executeOrderPlacement(method, total) {
        state.order = {
          id: "HM" + Math.floor(1000 + Math.random() * 9000),
          items: state.cart.slice(),
          notes: state.cookingNotes || "",
          tip: state.tipAmount || 0,
          total: total,
          table: state.table,
          customerPhone: state.customerPhone,
          customerName: state.customerName,
          time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
          payment: method,
          status: 0
        };
        saveOrder(state.order);

        // ================= FIREBASE FIRESTORE SYNC CALL =================
        if (typeof window.pushOrderToFirestore === "function") {
          window.pushOrderToFirestore(state.order);
        }

        state.cart = [];
        state.cookingNotes = '';
        state.tipAmount = 0;
        state.paymentMethod = null;
        updateCartUI();
        App.navigate("order");
        showToast("Order placed!");

        triggerAdminNotification("📦 New Order Received!", "Table " + state.order.table + " placed order " + state.order.id + " for ₹" + state.order.total);

        [1,2,3,4,5].forEach(function(status, i) {
          setTimeout(function() {
            if (state.order) {
              state.orderStatus = status;
              updateStoredOrder(state.order.id, { status: status });
              if (state.screen === "order") App.navigate("order");
              if (status === 5) showToast("Food served! Enjoy your meal");
            }
          }, (i + 1) * 7000);
        });
      },

      confirmPayment() {
        if (!state.customerPhone) {
          App.openLoginModal('payment');
          return;
        }
        if (!state.paymentMethod || state.cart.length === 0) return;
        var total = cartTotal();

        if (["phonepe", "gpay", "paytm", "navi", "upi"].includes(state.paymentMethod)) {
          tryOpenSpecificUpi(state.paymentMethod, total);
          setTimeout(function() {
            App.executeOrderPlacement(state.paymentMethod, total);
          }, 2500);
          return;
        }

        showToast("Placing order...");
        setTimeout(function() {
          App.executeOrderPlacement(state.paymentMethod, total);
        }, 1000);
      },

      sendWhatsAppWithImage(orderId) {
        var orders = loadOrders();
        var o = orders.find(x => x.id === orderId) || state.order;
        if (!o) return;
        sendBillWithImageToWhatsApp(o);
      },

      downloadBillImage() {
        var element = document.getElementById("printable-receipt");
        if (!element) return;
        showToast("Generating Bill Image...");
        html2canvas(element, { scale: 2, backgroundColor: "#fffef8" }).then(function(canvas) {
          var link = document.createElement("a");
          link.download = "Hotel_Muskan_Bill_" + Date.now() + ".png";
          link.href = canvas.toDataURL("image/png");
          link.click();
          showToast("Bill Image Saved!");
        }).catch(function(err) {
          console.error(err);
          showToast("Error creating image");
        });
      },

      printPaperReceipt(orderId) {
        const orders = loadOrders();
        const o = orders.find(x => x.id === orderId) || state.order;
        if (!o) return;
        const modal = document.getElementById("modal-container");
        modal.innerHTML = `
          <div class="w-full max-w-xs my-auto">
            <div id="printable-receipt">
              ${createReceiptHtml(o)}
            </div>

            <div class="space-y-2 mt-3">
              <button onclick="App.downloadBillImage()" class="w-full bg-blue-600 text-white py-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1">
                📷 Save Bill as Image (PNG)
              </button>
              <button onclick="window.print()" class="w-full bg-neutral-800 border border-yellow-500/40 text-yellow-400 py-2 rounded-xl font-bold text-[11px]">PRINT</button>
              <button onclick="App.closeModal()" class="w-full text-center text-xs py-1 text-stone-400 underline">Close</button>
            </div>
          </div>
        `;
        modal.classList.remove("hidden");
        modal.classList.add("flex");
      },

      simulateQR() {
        const modal = document.getElementById("modal-container");
        modal.innerHTML = `
          <div class="bg-neutral-900 border border-gold-500/40 rounded-2xl p-5 w-full max-w-xs text-white text-center my-auto">
            <h3 class="font-bold text-sm mb-2 text-yellow-400">Select Active Table</h3>
            <div class="grid grid-cols-4 gap-2 mb-4">
              ${TABLES.slice(0, 12).map(tbl => `
                <button onclick="App.setTable('${tbl.id}')" class="p-2 rounded-xl text-xs font-bold border ${state.table === tbl.id ? 'bg-gold-500 text-black' : 'bg-neutral-800 border-yellow-500/20'}">${tbl.id.replace('TABLE-','')}</button>
              `).join('')}
            </div>
            <button onclick="App.closeModal()" class="w-full py-2 bg-neutral-800 rounded-xl text-xs">Cancel</button>
          </div>
        `;
        modal.classList.remove("hidden");
        modal.classList.add("flex");
      },

      setTable(tblId) {
        state.table = tblId;
        document.getElementById("table-display-pill").textContent = tblId;
        App.closeModal();
        showToast("Connected to " + tblId);
        App.navigate(state.screen);
      },

      clearCart() {
        state.cart = [];
        state.cookingNotes = '';
        state.tipAmount = 0;
        updateCartUI();
        App.navigate("cart");
        showToast("Cart cleared");
      },

      randomThali() {
        var picks = {};
        ["rice", "bread", "dal", "sabzi", "protein", "dessert"].forEach(function(k) {
          var opts = (THALI_OPTIONS[k] || []).filter(function(o) { return o.price > 0 && o.available !== false; });
          if (opts.length) picks[k] = opts[Math.floor(Math.random() * opts.length)];
        });
        state.thali = {
          rice: picks.rice || null,
          bread: picks.bread || null,
          dal: picks.dal || null,
          sabzi: picks.sabzi || null,
          protein: picks.protein || null,
          sides: [],
          dessert: picks.dessert || null
        };
        App.navigate("thali");
        showToast("🎲 Surprise Thali ready!");
      },

      requestWater() { 
        var req = {
          id: "REQ-" + Date.now(),
          type: "water",
          table: state.table,
          time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
        };
        saveServiceRequest(req);
        triggerAdminNotification("💧 Water Requested!", "Guest at " + state.table + " requested drinking water.");
        showToast("💧 Water requested — waiter notified"); 
      },

      requestWaiter() { 
        var req = {
          id: "REQ-" + Date.now(),
          type: "waiter",
          table: state.table,
          time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
        };
        saveServiceRequest(req);
        triggerAdminNotification("🙋 Waiter Called!", "Guest at " + state.table + " is calling for assistance.");
        showToast("🙋 Waiter called to your table"); 
      },

      completeServiceRequest(reqId) {
        var reqs = loadServiceRequests().filter(r => r.id !== reqId);
        localStorage.setItem("muskan_service_requests", JSON.stringify(reqs));
        showToast("Request resolved ✓");
        App.navigate("admin");
      },

      clearServiceRequests() {
        localStorage.setItem("muskan_service_requests", "[]");
        showToast("All calls cleared");
        App.navigate("admin");
      },

      openAdmin() {
        var pin = prompt("Admin PIN", "");
        if (pin === null) return;
        if (pin !== "1234" && pin !== "muskan") {
          showToast("Wrong PIN");
          return;
        }
        App.navigate("admin");
      },

      adminSetStatus(orderId, statusNum) {
        state.orderStatus = statusNum;
        updateStoredOrder(orderId, { status: statusNum });
        if (state.order && state.order.id === orderId) state.orderStatus = statusNum;
        showToast("Status updated");
        App.navigate("admin");
      },

      adminClearOrders() {
        if (!confirm("Clear all orders?")) return;
        localStorage.setItem("muskan_orders", "[]");
        showToast("Orders cleared");
        App.navigate("admin");
      }
    };

    // ========== INIT ==========
    try {
      var cartBtn = document.getElementById("floating-cart");
      if (cartBtn) cartBtn.addEventListener("click", function() { App.navigate("cart"); });
      document.querySelectorAll(".nav-btn").forEach(function(btn) {
        btn.addEventListener("click", function() { App.navigate(btn.dataset.screen); });
      });
    } catch (e) { console.error(e); }

    // Start App Flow: Loading -> Login -> Main Screen
    App.initAppFlow();
  })();
  </script>
</body>
</html>
